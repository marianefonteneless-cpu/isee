<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iSee</title>

    <style>

        /* =========================
           CONFIGURAÇÕES GERAIS
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f0f14;
            color: white;
        }


        /* =========================
           CABEÇALHO
        ========================= */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 20px 40px;

            background: #17171f;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 25px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .menu a:hover {
            color: #b9b9ff;
        }


        /* =========================
           ÁREA PRINCIPAL
        ========================= */

        .hero {
            padding: 70px 40px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            color: #bdbdc7;
            margin-bottom: 30px;
        }


        /* =========================
           BUSCA
        ========================= */

        .search {
            width: 100%;
            max-width: 600px;

            padding: 16px;

            border-radius: 10px;
            border: none;

            font-size: 16px;

            outline: none;
        }

        .search:focus {
            box-shadow: 0 0 0 2px #7777ff;
        }


        /* =========================
           CATEGORIAS
        ========================= */

        .categories {
            padding: 0 40px 40px;
        }

        .categories h2 {
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .category {
            padding: 15px 25px;

            border-radius: 10px;

            background: #24242e;
            color: white;

            border: none;

            cursor: pointer;

            font-size: 16px;
        }

        .category:hover {
            background: #343441;
        }


        /* =========================
           EM DESTAQUE
        ========================= */

        .featured {
            padding: 20px 40px 60px;
        }

        .featured h2 {
            margin-bottom: 25px;
        }


        /* =========================
           CONTAINER DOS FILMES
        ========================= */

        .movies {
            display: flex;

            flex-direction: row;

            gap: 25px;

            flex-wrap: nowrap;

            overflow-x: auto;

            padding-bottom: 15px;

            width: 100%;
        }


        /* Barra de rolagem */

        .movies::-webkit-scrollbar {
            height: 8px;
        }

        .movies::-webkit-scrollbar-track {
            background: #191922;
            border-radius: 10px;
        }

        .movies::-webkit-scrollbar-thumb {
            background: #44445a;
            border-radius: 10px;
        }


        /* =========================
           CARD
        ========================= */

        .movie-card {
            flex: 0 0 200px;

            width: 200px;

            background: #191922;

            border-radius: 12px;

            padding: 12px;

            transition: transform 0.2s;
        }

        .movie-card:hover {
            transform: translateY(-5px);
        }


        /* =========================
           CAPA
        ========================= */

        .movie-cover {
            width: 100%;

            height: 270px;

            background: #292936;

            border-radius: 8px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 50px;

            margin-bottom: 15px;
        }


        /* =========================
           INFORMAÇÕES DO CARD
        ========================= */

        .movie-card h3 {
            margin-bottom: 8px;
        }

        .movie-card p {
            color: #9999a5;

            margin-bottom: 10px;
        }

        .movie-card span {
            font-weight: bold;
        }


        /* =========================
           RESPONSIVIDADE
        ========================= */

        @media (max-width: 700px) {

            header {
                padding: 20px;
            }

            .menu {
                gap: 12px;
            }

            .menu a {
                font-size: 14px;
            }

            .hero {
                padding: 50px 20px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .categories {
                padding: 0 20px 30px;
            }

            .featured {
                padding: 20px 20px 40px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header>

        <div class="logo">
            iSee
        </div>


        <nav class="menu">

            <a href="#">
                Início
            </a>

            <a href="#">
                Explorar
            </a>

            <a href="#">
                Listas
            </a>

            <a href="#">
                Perfil
            </a>

        </nav>

    </header>



    <!-- =========================
         CONTEÚDO PRINCIPAL
    ========================== -->

    <main>


        <!-- HERO -->

        <section class="hero">

            <h1>
                Descubra algo novo.
            </h1>


            <p>
                Encontre, avalie e compartilhe
                aquilo que você ama.
            </p>


            <input
                class="search"
                type="text"
                placeholder="Buscar filmes, séries, livros ou animes..."
            >

        </section>



        <!-- CATEGORIAS -->

        <section class="categories">

            <h2>
                Explore por categoria
            </h2>


            <div class="buttons">


                <button class="category">
                    🎬 Filmes
                </button>


                <button class="category">
                    📺 Séries
                </button>


                <button class="category">
                    📚 Livros
                </button>


                <button class="category">
                    🍥 Animes
                </button>


            </div>

        </section>



        <!-- EM DESTAQUE -->

        <section class="featured">

            <h2>
                Em destaque
            </h2>


            <div class="movies">


                <!-- CARD 1 -->

                <div class="movie-card">

                    <div class="movie-cover">
                        🎬
                    </div>

                    <h3>
                        Filme Exemplo
                    </h3>

                    <p>
                        2026
                    </p>

                    <span>
                        ⭐ 8.5
                    </span>

                </div>



                <!-- CARD 2 -->

                <div class="movie-card">

                    <div class="movie-cover">
                        🎬
                    </div>

                    <h3>
                        Outro Filme
                    </h3>

                    <p>
                        2025
                    </p>

                    <span>
                        ⭐ 8.1
                    </span>

                </div>



                <!-- CARD 3 -->

                <div class="movie-card">

                    <div class="movie-cover">
                        🎬
                    </div>

                    <h3>
                        Mais um Filme
                    </h3>

                    <p>
                        2024
                    </p>

                    <span>
                        ⭐ 7.9
                    </span>

                </div>



                <!-- CARD 4 -->

                <div class="movie-card">

                    <div class="movie-cover">
                        🎬
                    </div>

                    <h3>
                        Novo Filme
                    </h3>

                    <p>
                        2026
                    </p>

                    <span>
                        ⭐ 8.7
                    </span>

                </div>



                <!-- CARD 5 -->

                <div class="movie-card">

                    <div class="movie-cover">
                        🎬
                    </div>

                    <h3>
                        Filme Popular
                    </h3>

                    <p>
                        2025
                    </p>

                    <span>
                        ⭐ 9.0
                    </span>

                </div>


            </div>

        </section>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>


</body>

</html>
