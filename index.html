<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iSee</title>


    <style>

        /* =========================
           CONFIGURAÇÕES GERAIS
        ========================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #0f0f14;

            color: white;

        }


        /* =========================
           CABEÇALHO
        ========================== */

        header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 20px 40px;

            background: #17171f;

        }


        .logo {

            font-size: 30px;

            font-weight: bold;

        }


        .menu {

            display: flex;

            gap: 25px;

        }


        .menu a {

            color: white;

            text-decoration: none;

        }


        /* =========================
           ÁREA PRINCIPAL
        ========================== */

        .hero {

            padding: 70px 40px;

        }


        .hero h1 {

            font-size: 48px;

            margin-bottom: 15px;

        }


        .hero p {

            font-size: 20px;

            color: #bdbdc7;

            margin-bottom: 30px;

        }


        /* =========================
           CAMPO DE BUSCA
        ========================== */

        .search {

            width: 100%;

            max-width: 600px;

            padding: 16px;

            border-radius: 10px;

            border: none;

            font-size: 16px;

        }


        /* =========================
           CATEGORIAS
        ========================== */

        .categories {

            padding: 0 40px 40px;

        }


        .categories h2 {

            margin-bottom: 20px;

        }


        .buttons {

            display: flex;

            gap: 15px;

            flex-wrap: wrap;

        }


        .category {

            padding: 15px 25px;

            border-radius: 10px;

            background: #24242e;

            color: white;

            border: none;

            cursor: pointer;

            font-size: 16px;

        }


        .category:hover {

            background: #343441;

        }


        /* =========================
           FILMES EM DESTAQUE
        ========================== */

        .featured {

            padding: 20px 40px 60px;

        }


        .featured h2 {

            margin-bottom: 25px;

        }


        .movies {

            display: flex;

            flex-direction: row;

            gap: 25px;

            flex-wrap: nowrap;

            overflow-x: auto;

        }


        /* =========================
           CARD DO FILME
        ========================== */

        .movie-card {

            flex: 0 0 200px;

            background: #191922;

            border-radius: 12px;

            padding: 12px;

            transition: transform 0.2s;

        }


        .movie-card:hover {

            transform: translateY(-5px);

        }


        .movie-cover {

            height: 270px;

            background: #292936;

            border-radius: 8px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 50px;

            margin-bottom: 15px;

        }


        .movie-card h3 {

            margin-bottom: 8px;

        }


        .movie-card p {

            color: #9999a5;

            margin-bottom: 10px;

        }


        .movie-card span {

            font-weight: bold;

        }


    </style>

</head>


<body>


    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header>

        <div class="logo">

            iSee

        </div>


        <nav class="menu">

            <a href="#">Início</a>

            <a href="#">Explorar</a>

            <a href="#">Listas</a>

            <a href="#">Perfil</a>

        </nav>

    </header>



    <main>


        <!-- =========================
             ÁREA PRINCIPAL
        ========================== -->

        <section class="hero">

            <h1>

                Descubra algo novo.

            </h1>


            <p>

                Encontre, avalie e compartilhe
                aquilo que você ama.

            </p>


            <input

                class="search"

                type="text"

                placeholder="Buscar filmes, séries, livros ou animes..."

            >

        </section>



        <!-- =========================
             CATEGORIAS
        ========================== -->

        <section class="categories">

            <h2>

                Explore por categoria

            </h2>


            <div class="buttons">


                <button class="category">

                    🎬 Filmes

                </button>


                <button class="category">

                    📺 Séries

                </button>


                <button class="category">

                    📚 Livros

                </button>


                <button class="category">

                    🍥 Animes

                </button>


            </div>

        </section>



        <!-- =========================
             FILMES EM DESTAQUE
        ========================== -->

        <section class="featured">

            <h2>

                Em destaque

            </h2>


            <!--
                O JavaScript vai colocar
                os filmes aqui automaticamente.
            -->

            <div
                class="movies"
                id="movies-container"
            >

            </div>

        </section>


    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>


</body>

</html>
