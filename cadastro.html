<!DOCTYPE html>

<html lang="pt-BR">

<head>

```
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Criar conta - iSee</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;

        background: #0f0f14;

        color: white;

        min-height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        padding: 20px;
    }

    .cadastro-container {
        width: 100%;

        max-width: 420px;

        background: #191922;

        padding: 35px;

        border-radius: 16px;
    }

    .logo {
        text-align: center;

        font-size: 36px;

        font-weight: bold;

        margin-bottom: 10px;
    }

    .subtitulo {
        text-align: center;

        color: #9999a5;

        margin-bottom: 30px;
    }

    .campo {
        margin-bottom: 18px;
    }

    .campo label {
        display: block;

        margin-bottom: 8px;

        font-size: 14px;
    }

    .campo input {
        width: 100%;

        padding: 14px;

        border: none;

        border-radius: 8px;

        background: #292936;

        color: white;

        font-size: 16px;

        outline: none;
    }

    .campo input:focus {
        outline: 2px solid #5555ff;
    }

    .botao-cadastro {
        width: 100%;

        padding: 15px;

        margin-top: 10px;

        border: none;

        border-radius: 8px;

        background: #5555ff;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;
    }

    .botao-cadastro:hover {
        background: #4444dd;
    }

    .login {
        text-align: center;

        margin-top: 25px;

        color: #9999a5;
    }

    .login a {
        color: white;

        text-decoration: none;

        font-weight: bold;
    }

</style>
```

</head>

<body>

```
<div class="cadastro-container">


    <div class="logo">
        iSee
    </div>


    <p class="subtitulo">
        Crie sua conta e descubra algo novo.
    </p>


    <form>


        <div class="campo">

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >

        </div>


        <div class="campo">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

        </div>


        <div class="campo">

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Crie uma senha"
                required
            >

        </div>


        <div class="campo">

            <label for="confirmar-senha">
                Confirmar senha
            </label>

            <input
                type="password"
                id="confirmar-senha"
                placeholder="Digite a senha novamente"
                required
            >

        </div>


        <button
            type="submit"
            class="botao-cadastro"
        >
            Criar minha conta
        </button>


    </form>


    <p class="login">

        Já possui uma conta?

        <a href="login.html">
            Entrar
        </a>

    </p>


</div>
```

</body>

</html>
